name: V8 runner allocation diagnostic

# Zero-spend policy: manual-only runner diagnosis.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    if: github.ref == 'refs/heads/develop-v8'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prove runner allocated without checkout or dependencies
        shell: bash
        run: |
          echo "V8 diagnostic runner allocated"
          echo "SHA=$GITHUB_SHA"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "No application or production files accessed"
