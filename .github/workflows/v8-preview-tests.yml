name: V8 preview automated tests

on:
  push:
    branches: [develop-v8]
  pull_request:
    branches: [develop-v8]
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending Windows runner minutes on superseded develop-v8 commits.
concurrency:
  group: v8-preview-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install app and Qt test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PySide6
      - name: Compile preview Python modules and tests
        shell: pwsh
        run: python -m compileall -q velopos_qt tests
      - name: Run dependency-free SQLite crash recovery contract
        run: python -m unittest -v tests.test_v8_sqlite_crash_contract
      - name: Verify fail-closed release and transaction proof contracts
        shell: pwsh
        run: python -m unittest -v tests.test_v8_release_readiness tests.test_v8_commercial_boundary_assessment tests.test_v8_sale_request_service tests.test_v8_sale_rehearsal_journal tests.test_v8_durable_sale_rehearsal
      - name: Combined V8 test suite (no skips)
        shell: pwsh
        run: |
          python run_v8_checks.py --verbose 2>&1 | Tee-Object -FilePath v8-preview-test-results.txt
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Write-Error "V8 preview regression suite failed with exit code $testExit"
            exit $testExit
          }
      - name: Preserve V8 test output for failure diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-preview-windows-test-output
          path: v8-preview-test-results.txt
          if-no-files-found: warn
          retention-days: 14
