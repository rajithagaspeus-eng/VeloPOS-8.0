name: V8 sandbox regression (develop-v8 only)

on:
  push:
    branches: [develop-v8]
    paths:
      - 'velopos_qt/**'
      - 'velopos/**'
      - 'tests/test_v8_sandbox_sale_ledger.py'
      - 'tests/test_v8_phase2_atomic_sale_boundary.py'
      - '.github/workflows/v8-sandbox-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8-sandbox-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-regression:
    if: github.ref == 'refs/heads/develop-v8'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VELOPOS_HOME: ${{ runner.temp }}/VeloPOS8PreviewData
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview regression dependencies
        run: python -m pip install 'cryptography>=42' 'pillow>=10' 'qrcode' 'customtkinter>=5.2' pyserial
      - name: Compile sandbox modules and regression tests
        run: python -m compileall -q velopos_qt/sandbox_sale_ledger.py velopos_qt/idempotency_ledger.py tests/test_v8_sandbox_sale_ledger.py tests/test_v8_phase2_atomic_sale_boundary.py
      - name: Check installed preview dependencies
        run: python -m pip check
      - name: Verify commercial release gates remain closed
        run: |
          python -m unittest -v tests.test_v8_release_readiness tests.test_v8_commercial_boundary_assessment tests.test_v8_sale_request_service
          python -m velopos_qt.release_readiness > v8-release-readiness.json
      - name: Preserve release readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-release-readiness
          path: v8-release-readiness.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Run isolated sandbox and atomic boundary regression suites
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v tests.test_v8_sandbox_sale_ledger tests.test_v8_phase2_atomic_sale_boundary 2>&1 | tee v8-sandbox-regression.log
      - name: Preserve regression output for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-sandbox-regression-log
          path: v8-sandbox-regression.log
          if-no-files-found: ignore
          retention-days: 14
