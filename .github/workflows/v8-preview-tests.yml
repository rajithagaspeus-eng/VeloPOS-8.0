name: V8 preview automated tests

on:
  push:
    branches: [develop-v8]
  pull_request:
    branches: [develop-v8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install app and Qt test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PySide6
      - name: Combined V8 test suite (no skips)
        shell: pwsh
        run: python run_v8_checks.py
