# VeloPOS 8 preview verification; isolated TEST DATA ONLY, no release or posting.
# This workflow runs only for develop-v8 and never uses production secrets.
name: V8 Windows preview checks

on:
  push:
    branches: [develop-v8]
  pull_request:
    branches: [develop-v8]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-no-skips:
    name: Windows Python 3.12, all V8 preview tests (no skips)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install V8 preview and legacy fixture dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "PySide6>=6.7,<7"
          python -c "import sys; from PySide6 import QtWidgets; import cryptography; print('Python:', sys.executable); print('PySide6 / cryptography ready')"

      - name: Set isolated disposable V8 test data home
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'VeloPOS8PreviewData'
          "VELOPOS_HOME=$isolated" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "V8 tests use isolated Windows runner data; no customer or V7 database"

      - name: Validate syntax
        run: python -m compileall -q velopos_qt tests

      - name: Run full V8 preview suite (skip = CI failure)
        run: python run_v8_checks.py

      - name: Confirm code SHA covered by this test job
        if: always()
        shell: pwsh
        run: |
          Write-Host "Tested checkout SHA: $(git rev-parse HEAD)"
          Write-Host "GitHub event SHA: $env:GITHUB_SHA"
          Write-Host "This workflow verifies tests only; commercial Gate A-E remain separate."
